[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
allow_redefinition = true
check_untyped_defs = false
disable_error_code = ["attr-defined", "import-untyped"]

[[tool.mypy.overrides]]
module = ["src.gui.*"]
ignore_errors = true
